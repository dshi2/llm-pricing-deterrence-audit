[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pricing-deterrence-audit"
version = "0.1.0"
description = "Individual and joint deterrence among LLM pricing agents."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "openai>=1.40", "matplotlib>=3.8", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "scikit-learn>=1.7"]

[tool.setuptools]
packages = ["sprint", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Market and MainRules are frozen dataclasses: safe as defaults. Validation raises ValueError on purpose
# (callers catch one type). In tests, %-formatting keeps JSON braces readable.
ignore = ["TRY004"]
per-file-ignores = { "tests/*" = ["UP031"] }
flake8-bugbear = { extend-immutable-calls = ["sprint.market.Market", "sprint.experiments.MainRules"] }
