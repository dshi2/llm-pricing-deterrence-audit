name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-tested.txt -e '.[dev]'
      - run: bash scripts/get_starter.sh
      - run: python -m pip install -c requirements-tested.txt ./starter/util ./starter/algorithmic-pricing-llms
      - run: python -m pytest -q
      - run: python -m ruff check --config pyproject.toml scripts sprint tests
      - run: python -m scripts.build_readme_results
