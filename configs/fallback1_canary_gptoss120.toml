name = "fallback1_canary_gptoss120"
experiment = "replacement"
seeds = [99]
concurrency = 1

[model]
model = "openai/gpt-oss-120b"
provider = "DeepInfra"
provider_route = "deepinfra/bf16"
quantization = "bf16"
