# Main study, pilot slice (seeds 1-4). The continuation adds seeds 5..N to the same run directory.
name = "main_qwen38"
experiment = "main"
seeds = [1, 2, 3, 4]
concurrency = 4

[model]
model = "qwen/qwen3.8-flash"
provider = "Alibaba"
provider_route = "alibaba/us-east-1"
reasoning_max_tokens = 6553  # OpenRouter's "high": 80% of the 8,192 cap
temperature = 0.7
max_tokens = 8192  # reasoning plus final reply
prefix = "P1"
units = "consistent"  # cost and profit in the price currency (see sprint/prompt.py)
