# Main study, pilot slice (seeds 1-4). The continuation adds seeds 5..N to the same run directory.
name = "main_deepseek41"
experiment = "main"
seeds = [1, 2, 3, 4]
concurrency = 4

[model]
model = "deepseek/deepseek-v4.1-flash-1017"
provider = "DeepInfra"
provider_route = "deepinfra/fp8"
quantization = "fp8"
temperature = 0.7
max_tokens = 8192  # reasoning plus final JSON; canary checks truncation
reasoning_effort = "high"
prefix = "P1"
units = "consistent"  # cost and profit in the price currency (see sprint/prompt.py)
