# Integration canary only: tiny game, NOT a main-study game (its rules differ, so it never pools).
name = "canary_qwen38"
experiment = "main"
seeds = [901]
concurrency = 1

[model]
model = "qwen/qwen3.8-flash"
provider = "Alibaba"
