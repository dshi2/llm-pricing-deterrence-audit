# Main study, pilot slice (seeds 1-4). The continuation adds seeds 5..N to the same run directory.
name = "main_deepseek31"
experiment = "main"
seeds = [1, 2, 3, 4]
concurrency = 4

[model]
model = "deepseek/deepseek-chat-v3.1"
provider = "DeepInfra"
provider_route = "deepinfra/fp4"
quantization = "fp4"
temperature = 0.7
max_tokens = 2000
prefix = "P1"
units = "consistent"  # cost and profit in the price currency (see sprint/prompt.py)
